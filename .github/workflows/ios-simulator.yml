name: iOS build + E2E (simulator, no signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure CocoaPods
        run: pod --version || sudo gem install cocoapods -N
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor iOS (runs pod install)
        run: npx cap sync ios
      - name: Build for simulator
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          clean build
          CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: App-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list -j devices available | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone') and x['isAvailable']))")
          echo "Using simulator $DEVICE"
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Install Appium and XCUITest driver
        run: |
          npm install -g appium@2
          appium driver install xcuitest@8
      - name: Install E2E test dependencies
        run: npm install --prefix e2e webdriverio@9
      - name: Start Appium server
        run: |
          nohup appium server --port 4723 > appium.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then echo "Appium up"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4723/status > /dev/null
      - name: Warm up Appium session (pre-build WDA)
        run: |
          cat > /tmp/warmup.json <<EOF
          {"capabilities":{"alwaysMatch":{"platformName":"iOS","appium:automationName":"XCUITest","appium:udid":"$SIM_UDID","appium:app":"$PWD/build/Build/Products/Debug-iphonesimulator/App.app","appium:noReset":false,"appium:skipLogCapture":true,"appium:simulatorStartupTimeout":300000}}}
          EOF
          SID=""
          for ATTEMPT in 1 2 3; do
            echo "Warm-up attempt $ATTEMPT"
            RESP=$(curl -s --max-time 900 -X POST http://127.0.0.1:4723/session -H 'Content-Type: application/json' --data @/tmp/warmup.json || true)
            SID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',{}).get('sessionId',''))" 2>/dev/null || true)
            if [ -n "$SID" ]; then break; fi
            echo "Attempt $ATTEMPT got no session; waiting 30s before retry"
            sleep 30
          done
          if [ -z "$SID" ]; then echo "Warm-up session failed:"; echo "$RESP" | head -c 2000; exit 1; fi
          echo "Warm-up session $SID created; deleting it"
          curl -s -X DELETE "http://127.0.0.1:4723/session/$SID" > /dev/null
          echo "Warm-up done: WDA pre-built, app pre-installed"
      - name: Run simulator E2E tests
        run: |
          set +e
          UDID="$SIM_UDID" APP_PATH="$PWD/build/Build/Products/Debug-iphonesimulator/App.app" SHOTS="$PWD/e2e-shots" REPORT="$PWD/e2e-report.json" node e2e/ios-appium-test.mjs
          CODE=$?
          mkdir -p e2e-shots
          touch e2e-report.json appium.log
          exit $CODE
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-results
          path: |
            e2e-shots/
            e2e-report.json
            appium.log
