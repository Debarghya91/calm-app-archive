name: iOS build (simulator, no signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure CocoaPods
        run: pod --version || sudo gem install cocoapods -N
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor iOS (runs pod install)
        run: npx cap sync ios
      - name: Build for simulator
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          clean build
          CODE_SIGNING_ALLOWED=NO
      - name: Launch in simulator and screenshot
        run: |
          DEVICE=$(xcrun simctl list -j devices available | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone') and x['isAvailable']))")
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.soulspace.wellbeing
          sleep 12
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/home.png
          sleep 8
          xcrun simctl io "$DEVICE" screenshot screenshots/home-later.png
          xcrun simctl terminate "$DEVICE" com.soulspace.wellbeing || true
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: App-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
